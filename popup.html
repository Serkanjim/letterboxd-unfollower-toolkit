<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterboxd Toolkit</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <img src="icon.png" alt="App Logo" class="app-logo">
                <h1>LB Unfollower Toolkit</h1>
            </div>
        </header>

        <main>
            <div id="search-view">
                <div class="input-group">
                    <label for="username">Letterboxd Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="username or profile URL" autocomplete="off" spellcheck="false">
                    </div>
                </div>

                <label class="check-option" for="fullScan">
                    <input type="checkbox" id="fullScan">
                    Full scan (slower)
                    <span class="check-hint">Rescans only read what changed since your last scan. Tick this to re-read every page.</span>
                </label>

                <div class="action-buttons">
                    <button id="checkBtn" class="btn btn-primary">
                        <span class="btn-text">Check Unfollowers</span>
                    </button>
                    <button id="resumeBtn" class="btn btn-secondary hidden">Resume Scan</button>
                    <button id="cancelBtn" class="btn btn-danger hidden">Cancel Scan</button>
                </div>
            </div>

            <div id="status" class="status-message" role="status" aria-live="polite"></div>

            <div id="progress-container" class="progress-container hidden">
                <div class="progress-bar" id="progressBar" role="progressbar" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText">0%</span>
            </div>

            <div id="results-view" class="hidden">
                <div class="tabs" role="tablist" aria-label="Result lists">
                    <button class="tab" role="tab" data-tab="unfollowers" aria-selected="true">Not back<span class="tab-count"></span></button>
                    <button class="tab" role="tab" data-tab="fans" aria-selected="false" tabindex="-1">Fans<span class="tab-count"></span></button>
                    <button class="tab" role="tab" data-tab="mutuals" aria-selected="false" tabindex="-1">Mutual<span class="tab-count"></span></button>
                    <button class="tab" role="tab" data-tab="changes" aria-selected="false" tabindex="-1">Changes<span class="tab-count"></span></button>
                </div>

                <div class="results-header">
                    <h3 id="resultsTitle">Not Following Back</h3>
                    <span class="badge" id="count">0</span>
                </div>

                <div class="toolbar">
                    <input type="text" id="filter" placeholder="Filter by name…" autocomplete="off" spellcheck="false" aria-label="Filter the list">
                    <select id="sortSelect" aria-label="Sort order">
                        <option value="site">Letterboxd order</option>
                        <option value="name">Name (A–Z)</option>
                    </select>
                </div>

                <div id="verification" class="verification-warning hidden" role="alert"></div>

                <div class="list-wrapper">
                    <ul id="list" class="user-list" role="tabpanel"></ul>
                </div>

                <button id="hiddenToggle" class="link-btn hidden"></button>

                <div class="action-buttons">
                    <div class="export-row">
                        <button id="copyBtn" class="btn btn-secondary" title="Copy the profile links of the list as shown">Copy links</button>
                        <select id="exportFormat" aria-label="Download format" title="Download the list as shown">
                            <option value="txt">.txt</option>
                            <option value="csv">.csv</option>
                            <option value="json">.json</option>
                        </select>
                        <button id="downloadBtn" class="btn btn-secondary">Download</button>
                    </div>
                    <button id="resetBtn" class="btn btn-danger">
                        New Search
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <span class="support-text">Want to support my work?</span>

            <a href="https://www.buymeacoffee.com/serkansahinoglu" target="_blank" class="donate-btn">
                <span>☕</span> Buy me a Coffee
            </a>

            <p class="info-text" id="windowInfo">✅ You can close this window. Analysis runs in background.</p>

            <details class="settings" id="settings">
                <summary>Settings</summary>
                <label class="setting"><input type="checkbox" id="prefAvatars"> Show avatars</label>
                <label class="setting"><input type="checkbox" id="prefBadges"> Mark people who don't follow me back on Letterboxd pages</label>
                <label class="setting"><input type="checkbox" id="prefDaily"> Check once a day in the background<span id="dailyAccount"></span></label>
                <label class="setting indent"><input type="checkbox" id="prefNotify"> Also show a notification when someone unfollows</label>
                <p class="setting-note" id="settingsNote" role="status"></p>
            </details>

            <button id="clearDataBtn" class="link-btn">Clear saved history</button>
        </footer>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
